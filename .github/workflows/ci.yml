name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  geo-batch-toolkit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 01-geo-batch-toolkit
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -v
